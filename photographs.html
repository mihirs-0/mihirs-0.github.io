<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Photographs — Mihir Sahasrabudhe</title>
<meta name="description" content="Photographs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,700;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5EFE1;color:#23201C;font-family:'Newsreader',Georgia,serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
a{color:#8C3B2E;text-decoration:none;}
a:hover{color:#1B2333;}
::selection{background:#1B2333;color:#EFE3C8;}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
img{display:block;max-width:100%;}
@media (max-width:760px){.plate{display:none !important;}.stick{position:static !important;}}
</style>
</helmet>

<div data-screen-label="Photographs" style="position:relative;min-height:100vh">
  <div style="position:relative;max-width:1040px;margin:0 auto;padding:36px 32px 80px">
    <header style="display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;animation:rise .7s ease both">
      <a href="./" style="display:block;width:64px;height:44px;overflow:hidden;opacity:.9;transition:opacity .3s" style-hover="opacity:1"><img src="assets/art/megh-dutam.jpg" alt="Home" style="width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block;mix-blend-mode:multiply"></a>
      <nav style="display:flex;gap:26px;flex-wrap:wrap;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#5B554B">
        <a href="notes.html" style="color:inherit;transition:color .2s" style-hover="color:#8C3B2E">Notes</a>
        <a href="readings.html" style="color:inherit;transition:color .2s" style-hover="color:#8C3B2E">Readings</a>
        <a href="photographs.html" style="color:#8C3B2E">Photographs</a>
        <a href="./#colophon" style="color:inherit;transition:color .2s" style-hover="color:#8C3B2E">About</a>
      </nav>
    </header>

    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-top:72px;border-bottom:1px solid rgba(35,32,28,.25);padding-bottom:18px;animation:rise .9s .1s ease both">
      <div>
        <div style="font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#8C3B2E">III</div>
        <h1 style="font-family:'Newsreader',Georgia,serif;font-weight:400;font-size:clamp(48px,6vw,72px);line-height:.98;margin:12px 0 0;color:#23201C">Photographs</h1>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:44px 32px;padding-top:48px">
      <sc-for list="{{ photos }}" as="p" hint-placeholder-count="11">
        <figure style="margin:0">
          <div style="aspect-ratio:3/4;overflow:hidden;background:rgba(27,35,51,.08);box-shadow:0 18px 36px -24px rgba(27,35,51,.5);transition:transform .5s ease" style-hover="transform:translateY(-4px)">{{ p.imgEl }}</div>
          <figcaption style="margin-top:12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#5B554B;line-height:1.5">{{ p.caption }}</figcaption>
        </figure>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const img = 'assets/img/';
    const photos = [
      { src: img + 'chicago-loop.jpeg',     cap: 'The Loop from above',  place: 'Chicago' },
      { src: img + 'looking-up.jpeg',       cap: 'Straight up',          place: 'Chicago' },
      { src: img + 'chicago-lake.jpeg',     cap: 'Skyline and lake',     place: 'Chicago' },
      { src: img + 'sf-cable-tracks.jpeg',  cap: 'Cable car tracks',     place: 'San Francisco' },
      { src: img + 'flag-dome.jpeg',        cap: 'Flag in the great hall', place: 'Union Station, Chicago' },
      { src: img + 'beach-cars.jpeg',       cap: 'Cars on the sand', place: 'Daytona Beach, FL' },
      { src: img + 'harbor-sunset.jpeg',    cap: 'Golden hour',          place: 'Barnegat Bay, NJ' },
      { src: img + 'statue-liberty.jpeg',   cap: 'Looking up',           place: 'Liberty Island, NY' },
      { src: img + 'brooklyn-bridge.jpeg',  cap: 'Cables',               place: 'Brooklyn Bridge' },
      { src: img + 'wrigley-tower.jpeg',    cap: 'High noon',            place: 'Wrigley Building, Chicago' },
      { src: img + 'uiuc-quad.jpeg',        cap: 'Winter term',          place: 'The Quad, UIUC' },
    ].map(p => Object.assign(p, {
      caption: p.place ? p.cap + ' \u2014 ' + p.place : p.cap,
      imgEl: React.createElement('img', { src: p.src, alt: p.cap, loading: 'lazy', style: { width: '100%', height: '100%', objectFit: 'cover', display: 'block' } }),
    }));
    return { photos };
  }
}
</script>
</body>
</html>
