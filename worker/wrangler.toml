name = "map-of-reality-admin"
main = "src/entry.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "map-admin.mihirss.com", custom_domain = true }]

[vars]
# Production writes follow the approved public GitHub Pages branch.
LEDGER_BRANCH = "main"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1044266898"
simple = { limit = 5, period = 60 }

[observability]
enabled = false
