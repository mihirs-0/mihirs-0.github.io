<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Mihir Sahasrabudhe</title>
<meta name="description" content="Mihir Sahasrabudhe - notes, readings and photographs. Let's make AI go well.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,700;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F1E7D2;color:#23201C;font-family:'Newsreader',Georgia,serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
a{color:#23201C;text-decoration:none;}
a:hover{color:#8C3B2E;}
img{display:block;max-width:100%;}
::selection{background:#1B2333;color:#EFE3C8;}
[id]{scroll-margin-top:24px;}
@keyframes frieze{from{opacity:0;}to{opacity:.85;}}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
@media (max-width:900px){
  .home{grid-template-columns:1fr !important;padding:5vh 7vw 120px !important;gap:34px !important;}
}
</style>
</helmet>

<div data-screen-label="Home" class="home" style="min-height:100vh;box-sizing:border-box;padding:7vh 6vw 110px;display:grid;grid-template-columns:minmax(420px,1fr) minmax(260px,1fr);gap:40px 8vw;align-items:start;max-width:1400px;margin:0 auto">

  <div style="animation:rise 1s .15s ease both;max-width:720px">
    <img src="assets/art/megh-dutam.jpg" alt="Megh Dutam illustration, Guler school, c. 1800" style="width:100%;max-width:467px;aspect-ratio:467/318;object-fit:cover;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(to right,transparent 0%,#000 5%,#000 95%,transparent 100%),linear-gradient(to bottom,transparent 0%,#000 5%,#000 95%,transparent 100%);mask-image:linear-gradient(to right,transparent 0%,#000 5%,#000 95%,transparent 100%),linear-gradient(to bottom,transparent 0%,#000 5%,#000 95%,transparent 100%);-webkit-mask-composite:source-in;mask-composite:intersect">

    <div style="display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:40px;font-size:15px;color:#5B554B">
      <a href="mailto:{{ email }}" style="color:inherit">Email</a>
      <a href="https://{{ github }}" style="color:inherit">GitHub</a>
      <a href="https://{{ linkedin }}" style="color:inherit">LinkedIn</a>
      <a href="https://{{ x }}" style="color:inherit">X</a>
      <a href="https://{{ lesswrong }}" style="color:inherit">LessWrong</a>
    </div>

    <div style="animation:rise .8s ease both;margin-top:40px">
      <h1 style="font-family:'Newsreader',Georgia,serif;font-weight:700;font-size:clamp(40px,4.4vw,60px);line-height:.86;letter-spacing:-.03em;margin:0;color:#23201C">Mihir<br>Sahasrabudhe</h1>

      <nav style="display:flex;flex-direction:column;gap:12px;margin-top:28px;font-family:'Newsreader',Georgia,serif;font-size:clamp(28px,2.6vw,38px);line-height:1;font-weight:400">
        <a href="notes.html" style="transition:color .2s">Notes</a>
        <a href="photographs.html" style="transition:color .2s">Photographs</a>
        <a href="readings.html" style="transition:color .2s">Readings</a>
      </nav>
    </div>
  </div>

  <div style="animation:rise 1s .3s ease both">
    <div style="max-width:30em;width:100%">
      <p style="font-family:'Newsreader',Georgia,serif;font-size:clamp(26px,2.4vw,34px);line-height:1.2;color:#23201C;margin:0;text-wrap:pretty">Let's make AI go well.</p>
      <p style="font-size:19px;line-height:1.65;color:#4A443B;margin:18px 0 0;text-wrap:pretty">The future has to be human.</p>

      <div id="colophon" style="margin-top:44px;padding-top:24px;border-top:1px solid rgba(35,32,28,.25)">
        <div>
          <a href="https://intelligence-curse.ai/" target="_blank" rel="noopener" style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#5B554B;transition:color .2s" style-hover="color:#8C3B2E">the intelligence curse &#8599;</a>
        </div>
      </div>
    </div>
  </div>

</div>

<div aria-hidden="true" style="position:fixed;left:0;right:0;bottom:0;height:64px;pointer-events:none;animation:frieze 2.6s .8s ease both;opacity:.8;mix-blend-mode:multiply;background-image:url('assets/art/bahadur-shah-frieze.jpg');background-repeat:repeat-x;background-size:auto 200%;background-position:center top;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 40%,#000 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 40%,#000 100%)"></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      email: 'mihirss2@illinois.edu',
      github: 'github.com/mihirs-0',
      linkedin: 'linkedin.com/in/mihir-sahasrabudhe',
      x: 'x.com/mihirss2',
      lesswrong: 'www.lesswrong.com/users/mihir-sahasrabudhe',
    };
  }
}
</script>
</body>
</html>
